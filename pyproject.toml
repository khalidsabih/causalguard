[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalguard"
version = "0.1.0"
description = "Research scaffold for monitoring and retraining causal targeting policies under distribution shift."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
mlops = ["mlflow>=2.17", "dvc>=3.55"]
dev = ["pytest>=8.0", "ruff>=0.7"]
all = [
  "streamlit>=1.40",
  "plotly>=5.24",
  "mlflow>=2.17",
  "dvc>=3.55",
  "pytest>=8.0",
  "ruff>=0.7",
]

[project.scripts]
causalguard-run = "causalguard.pipelines.run_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
